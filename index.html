<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ankit Vayam Jan Seva Kendra</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font-family:system-ui,Arial}header{background:#1457a6;color:white;padding:22px 16px}header h2{margin:0}main{max-width:950px;margin:20px auto;padding:0 12px}.card{background:white;border:1px solid #dce3ed;border-radius:14px;padding:17px;margin-bottom:14px}h3{margin:0 0 12px}label{display:block;font-weight:650;font-size:13px;margin:12px 0 5px}input,textarea,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button{border:0;border-radius:8px;background:#1457a6;color:white;padding:11px 15px;margin:8px 5px 0 0;font-weight:700}button.alt{background:#e8eef7;color:#183a65}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}.hidden{display:none!important}.muted{font-size:13px;color:#667085}.msg{padding:10px;background:#eef6ff;border-radius:8px;margin:10px 0}.err{background:#fff0ef;color:#a1261c}.item{border:1px solid #dce3ed;border-radius:10px;padding:12px;margin:10px 0}.tag{font-size:12px;background:#eaf2ff;color:#1457a6;padding:4px 8px;border-radius:20px}
</style></head><body><header><h2>Ankit Vayam Jan Seva Kendra</h2><div>ऑनलाइन सेवा आवेदन एवं दस्तावेज पोर्टल</div></header><main>
<section id="login" class="card"><h3>लॉगिन / नया खाता</h3><div class="row"><button onclick="mode('customer')">ग्राहक</button><button class="alt" onclick="mode('admin')">एडमिन</button></div>
<div id="cust"><label>मोबाइल नंबर (10 अंक)</label><input id="mobile" maxlength="10" inputmode="numeric"><label>पासवर्ड (कम से कम 8 अक्षर)</label><input id="cpw" type="password"><button onclick="registerCustomer()">नया ग्राहक खाता बनाएँ</button><button class="alt" onclick="loginCustomer()">ग्राहक लॉगिन</button><p class="muted">SMS OTP नहीं आएगा। मोबाइल नंबर Login ID के रूप में इस्तेमाल होगा।</p></div>
<div id="adm" class="hidden"><label>एडमिन ईमेल</label><input id="aemail" type="email"><label>पासवर्ड</label><input id="apw" type="password"><button onclick="loginAdmin()">एडमिन लॉगिन</button></div><div id="loginMsg" class="msg hidden"></div></section>
<section id="customer" class="hidden"><div class="card"><button class="alt" onclick="logout()">लॉगआउट</button><h3>ग्राहक डैशबोर्ड</h3><div id="welcome" class="muted"></div></div>
<div class="card"><h3>नई सेवा का आवेदन</h3><label>सेवा का नाम</label><input id="service" placeholder="जैसे आय प्रमाण पत्र"><label>विवरण (वैकल्पिक)</label><textarea id="note"></textarea><label>दस्तावेज PDF/JPG/JPEG (अधिकतम 10 MB प्रति फाइल, अधिकतम 10 फाइल)</label><input id="docs" type="file" multiple accept=".pdf,.jpg,.jpeg,application/pdf,image/jpeg"><button onclick="applyService()">आवेदन भेजें</button><div id="custMsg" class="msg hidden"></div></div>
<div class="card"><h3>मेरे आवेदन</h3><div id="myApps">लोड हो रहा है…</div></div></section>
<section id="admin" class="hidden"><div class="card"><button class="alt" onclick="logout()">लॉगआउट</button><h3>एडमिन पैनल — सभी आवेदन</h3><div id="allApps">लोड हो रहा है…</div></div></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,setDoc,getDoc,addDoc,collection,query,where,getDocs,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
// अपनी Firebase और Supabase जानकारी यहाँ भरें:
const firebaseConfig={apiKey:"AIzaSyA5svDLVRQ5NzSkt62sOduehbXU08pI5AY",authDomain:"jan-seva-kendr-2.firebaseapp.com",projectId:"jan-seva-kendr-2",storageBucket:"jan-seva-kendr-2.firebasestorage.app",messagingSenderId:"1077320358799",appId:"1:1077320358799:web:bbfbf185334ccee90889fa"};
const SUPABASE_URL="https://lehjbkmfdocgmyhsfcgs.supabase.co",SUPABASE_KEY="sb_publishable_fm_k3DCEuUAgBGFpSNw65w_x1CXiqAT";
const BUCKET="janseva-private",ADMIN_EMAIL="ankitcps003@gmail.com";
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb),sb=createClient(SUPABASE_URL,SUPABASE_KEY);
let su=null,mob=null;
const $=x=>document.getElementById(x), synthetic=m=>m+"@login.ankitjanseva.in";
function showMsg(id,t,err=false){$(id).textContent=t;$(id).classList.remove("hidden");$(id).classList.toggle("err",err)}
function fail(e,id="loginMsg"){showMsg(id,e.message||String(e),true)}
function mode(m){$("cust").classList.toggle("hidden",m!=="customer");$("adm").classList.toggle("hidden",m!=="admin");$("loginMsg").classList.add("hidden")}
window.mode=mode;
async function storageAuth(email,password,signup=false){let r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(!r.data.session)throw Error("Supabase Authentication में Confirm email बंद करें।");su=r.data.user}
function checkConfig(){if(firebaseConfig.apiKey.startsWith("PASTE_")||SUPABASE_URL.startsWith("PASTE_")||SUPABASE_KEY.startsWith("PASTE_"))throw Error("index.html में Firebase और Supabase Config भरें।")}
window.registerCustomer=async()=>{try{checkConfig();let m=$("mobile").value.trim(),p=$("cpw").value;if(!/^[6-9][0-9]{9}$/.test(m))throw Error("सही 10 अंकों का मोबाइल नंबर भरें।");if(p.length<8)throw Error("पासवर्ड कम से कम 8 अक्षर का रखें।");let em=synthetic(m),u=await createUserWithEmailAndPassword(auth,em,p);try{await storageAuth(em,p,true);await setDoc(doc(db,"users",u.user.uid),{mobile:m,role:"customer",storageUid:su.id,createdAt:serverTimestamp()})}catch(e){await signOut(auth);throw e}mob=m;openCustomer()}catch(e){fail(e)}};
window.loginCustomer=async()=>{try{checkConfig();let m=$("mobile").value.trim(),p=$("cpw").value;if(!/^[6-9][0-9]{9}$/.test(m))throw Error("सही मोबाइल नंबर भरें।");let em=synthetic(m),u=await signInWithEmailAndPassword(auth,em,p),pr=await getDoc(doc(db,"users",u.user.uid));if(!pr.exists()||pr.data().role!=="customer")throw Error("ग्राहक प्रोफाइल नहीं मिली।");await storageAuth(em,p);mob=m;openCustomer()}catch(e){fail(e)}};
window.loginAdmin=async()=>{try{checkConfig();let em=$("aemail").value.trim().toLowerCase(),p=$("apw").value;if(em!==ADMIN_EMAIL.toLowerCase())throw Error("अनुमति प्राप्त Admin Email डालें।");await signInWithEmailAndPassword(auth,em,p);await storageAuth(em,p);$("login").classList.add("hidden");$("admin").classList.remove("hidden");await loadAdmin()}catch(e){fail(e)}};
function openCustomer(){$("login").classList.add("hidden");$("customer").classList.remove("hidden");$("welcome").textContent="मोबाइल: "+mob;loadMine()}
function safe(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function filename(s){return s.replace(/[^a-zA-Z0-9._-]/g,"_").slice(-70)}
async function upload(file,path,max){if(file.size>max)throw Error(file.name+" फाइल निर्धारित सीमा से बड़ी है।");if(!["application/pdf","image/jpeg"].includes(file.type))throw Error("केवल PDF/JPG फाइल मान्य है।");let r=await sb.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type});if(r.error)throw r.error;return{path,name:file.name,type:file.type,size:file.size}}
async function download(path,name){let r=await sb.storage.from(BUCKET).download(path);if(r.error)throw r.error;let u=URL.createObjectURL(r.data),a=document.createElement("a");a.href=u;a.download=name||"document";a.click();URL.revokeObjectURL(u)}
window.dl=async(p,n)=>{try{await download(p,n)}catch(e){alert(e.message)}};
window.applyService=async()=>{try{let s=$("service").value.trim(),fs=[...$("docs").files];if(!s||!fs.length)throw Error("सेवा का नाम और कम से कम एक दस्तावेज चुनें।");if(fs.length>10)throw Error("अधिकतम 10 दस्तावेज चुनें।");let ref=await addDoc(collection(db,"applications"),{ownerUid:auth.currentUser.uid,storageUid:su.id,mobile:mob,service:s,note:$("note").value,status:"प्राप्त",documents:[],completedFile:null,createdAt:serverTimestamp()});let uploaded=[];for(let i=0;i<fs.length;i++)uploaded.push(await upload(fs[i],`${su.id}/${ref.id}/documents/${Date.now()}_${i}_${filename(fs[i].name)}`,10*1024*1024));await updateDoc(ref,{documents:uploaded});showMsg("custMsg","आवेदन भेज दिया गया। आवेदन संख्या: "+ref.id);$("service").value="";$("note").value="";$("docs").value="";await loadMine()}catch(e){fail(e,"custMsg")}};
async function loadMine(){let q=query(collection(db,"applications"),where("ownerUid","==",auth.currentUser.uid)),r=await getDocs(q),a=r.docs.map(x=>({id:x.id,...x.data()})).sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));$("myApps").innerHTML=a.length?"":"अभी कोई आवेदन नहीं है।";for(let x of a){let d=document.createElement("div");d.className="item";d.innerHTML=`<b>${safe(x.service)}</b> <span class="tag">${safe(x.status)}</span><p class="muted">आवेदन: ${safe(x.id)}</p>`;for(let f of x.documents||[]){let b=document.createElement("button");b.className="alt";b.textContent="दस्तावेज: "+f.name;b.onclick=()=>dl(f.path,f.name);d.append(b)}if(x.completedFile){let b=document.createElement("button");b.textContent="तैयार PDF डाउनलोड करें";b.onclick=()=>dl(x.completedFile.path,x.completedFile.name);d.append(b)}$("myApps").append(d)}}
async function loadAdmin(){let r=await getDocs(collection(db,"applications")),a=r.docs.map(x=>({id:x.id,...x.data()})).sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));$("allApps").innerHTML=a.length?"":"कोई आवेदन नहीं आया।";for(let x of a){let d=document.createElement("div");d.className="item";d.innerHTML=`<b>${safe(x.service)}</b> <span class="tag">${safe(x.status)}</span><p>मोबाइल: ${safe(x.mobile)}</p><p class="muted">आवेदन: ${safe(x.id)}</p>`;for(let f of x.documents||[]){let b=document.createElement("button");b.className="alt";b.textContent="ग्राहक दस्तावेज डाउनलोड: "+f.name;b.onclick=()=>dl(f.path,f.name);d.append(b)}let box=document.createElement("div");box.innerHTML='<label>आवेदन स्थिति</label><select><option>प्राप्त</option><option>जाँच जारी</option><option>दस्तावेज़ की कमी</option><option>पूरा हुआ</option></select><label>तैयार PDF (20 MB तक)</label><input type="file" accept=".pdf,application/pdf"><button>अपडेट / PDF अपलोड</button>';let sel=box.querySelector("select"),inp=box.querySelector("input"),btn=box.querySelector("button");sel.value=x.status||"प्राप्त";btn.onclick=async()=>{try{btn.disabled=true;let cf=x.completedFile;if(inp.files[0]){let f=inp.files[0];if(f.type!=="application/pdf")throw Error("केवल PDF अपलोड करें।");cf=await upload(f,`${x.storageUid}/${x.id}/completed/${Date.now()}_${filename(f.name)}`,20*1024*1024)}await updateDoc(doc(db,"applications",x.id),{status:sel.value,completedFile:cf,updatedAt:serverTimestamp()});alert("आवेदन अपडेट हो गया।");await loadAdmin()}catch(e){alert(e.message)}finally{btn.disabled=false}};d.append(box);$("allApps").append(d)}}
window.logout=async()=>{await sb.auth.signOut();await signOut(auth);location.reload()};
</script></body></html>
